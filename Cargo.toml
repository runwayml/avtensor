[package]
name = "avtensor"
version = "0.8.1"
edition = "2021"
description = "High-performance decoding of media assets to torch Tensors"
repository = "https://github.com/runwayml/avtensor"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "avtensor"
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = "1.0.98"
aws-config = "1"
aws-runtime = "1"
# Default features minus `rustls`, which pulls in the legacy hyper 0.14 /
# rustls 0.21 client next to the current default one (`default-https-client`).
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
bytes = "1"
derive_builder = "0.20.2"
env_logger = {version = "0.11.8", features = ["kv"] }
google-cloud-gax = "1.9"
google-cloud-storage = "1.11"
http = "1.3.1"
libc = "0.2.175"
log = { version = "0.4.27", features = ["kv"] }
pyo3 = "0.25.0"
pyo3-log = "0.12.4"
rsmpeg = { version = "0.17.0", features = ["ffmpeg7_1"] }
# Each tch release targets one libtorch. No tch release supports torch 2.14
# yet, so this pins a fork of upstream tch-rs whose only change is the 2.14
# binding update (libtorch-2.14 branch, tch 0.27.0). Switch back to crates.io
# once upstream releases 2.14 support.
tch = { git = "https://github.com/RikHeijdens/tch-rs", rev = "b75d71aa421ab38983184bd71cd1708dac669fc8", features = ["python-extension"] }
# Same version as tch; only used for the opaque `C_tensor` handle in src/alloc.rs.
torch-sys = { git = "https://github.com/RikHeijdens/tch-rs", rev = "b75d71aa421ab38983184bd71cd1708dac669fc8" }
tempfile = "3.20.0"
thiserror = "2.0.15"
libloading = "0.8"
tokio = { version = "1.47.1", features = ["time"] }

# Workaround for https://pyo3.rs/main/faq#i-cant-run-cargo-test-or-i-cant-build-in-a-cargo-workspace-im-having-linker-issues-like-symbol-not-found-or-undefined-reference-to-_pyexc_systemerror
[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[build-dependencies]
# Compiles csrc/tensor_from_blob.cpp against the libtorch headers.
cc = "1.2"

[dev-dependencies]
mel_spec = "0.3.3"
ndarray = "0.16.1"
test-case = "3.3.1"

# Required to support profiling
[profile.release]
debug = true
